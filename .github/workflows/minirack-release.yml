# Minirack self-hosted runtime release.
#
# Builds the linux-x64 T3 Code runtime (the Node single-executable the npm
# launcher downloads) from this fork's patched source and publishes it as a
# GitHub release the minirack image pulls via T3CODE_RELEASE_BASE_URL:
#
#   T3CODE_RELEASE_BASE_URL=https://github.com/ArmandBriere/t3code/releases/download
#
# The npm launcher requests
#   ${T3CODE_RELEASE_BASE_URL}/v<version>/t3-<version>-linux-x64.tar.gz
# plus that release's SHA256SUMS, so the artifacts below use exactly those
# names and the release tag must be v<version> (v0.1.9).
#
# Mirrors release.yml's build_bundle + release-desktop.yml's Linux CLI archive
# on plain GitHub-hosted runners (no Blacksmith, no signing, no notarization).

name: minirack runtime release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must match the npm launcher pin, e.g. 0.1.9)
        required: true
        default: "0.1.9"
      tag:
        description: Release tag the npm launcher downloads from (e.g. v0.1.9)
        required: true
        default: "v0.1.9"

permissions:
  contents: write

concurrency:
  group: minirack-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x64-runtime:
    name: Build linux-x64 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Fork builds report "dev" telemetry, same as upstream's release gate.
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ inputs.version }}"

      # Builds the server bundle plus the web client into apps/server/dist.
      - name: Build JS bundle
        run: vp run --filter t3 build

      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      # native/resource-monitor ships inside the CLI archive.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml

      # build-cli-archive patches the executable's RUNPATH against libatomic.
      - name: Install archive tools
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf libatomic1; }

      - name: Stage resource monitor for the CLI archive
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$target_dir"
          cp native/resource-monitor/target/release/t3-resource-monitor "$target_dir/t3-resource-monitor"

      - name: Build CLI archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "${{ inputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ inputs.version }}"

      # The npm launcher validates the archive against this file by name.
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd release-cli
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Replace any earlier fork release under the same tag; the tag must
          # point at this patched tree, not at the inherited upstream tag.
          gh release delete "${{ inputs.tag }}" --yes --cleanup-tag || true
          git push origin ":refs/tags/${{ inputs.tag }}" || true
          gh release create "${{ inputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ inputs.tag }} (minirack patched)" \
            --notes "Minirack fork runtime: T3CODE_PUBLIC_URL, T3CODE_CLIENT_SESSION_TTL_DAYS, T3CODE_CONTAINER_MODE. Built from $GITHUB_SHA." \
            release-cli/t3-${{ inputs.version }}-linux-x64.tar.gz \
            release-cli/SHA256SUMS
